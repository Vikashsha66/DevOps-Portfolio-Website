
name: CI Pipeline

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [prod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Add project-specific tests here.

      - name: Docker build validation
        run: docker build -t app-ci:${{ github.sha }} .

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.30.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.30.0
        with:
          scan-type: image
          image-ref: app-ci:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
