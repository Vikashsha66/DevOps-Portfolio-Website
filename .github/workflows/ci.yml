name: CI Pipeline

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [prod]

permissions:
  contents: read

concurrency:
  group: fbsplims-app-producion${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Docker build validation
        run: docker build -t fbsplims-app:${{ github.sha }} .
